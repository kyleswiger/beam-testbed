# Elixir gates from the shared reusable workflow. Each job is a separate
# status check ("ci / format", "ci / test", ...) so the ruleset can require
# them individually. No Postgres: this app has no Ecto.
#
# TODO(pin): switch @main to @v1.1.0 once aws-reusable-workflows releases it.
name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: kyleswiger/aws-reusable-workflows/.github/workflows/elixir-ci.yml@main
    with:
      # This testbed has not added :credo, :sobelow, or :dialyxir; enabling
      # their gates makes CI fail before analysis can run. Keep the remaining
      # format, compile, dependency/audit, xref, and test gates enabled.
      credo: false
      sobelow: false
      dialyzer: false
      postgres: false
      audit-blocking: true
